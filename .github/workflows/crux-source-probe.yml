name: Crux public source probe (no deployment)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/crux-source-probe.yml
      - scripts/crux/probe.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crux-source-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/crux-public-source-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install normal Chromium browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Inspect unauthenticated public schedule
        run: python scripts/crux/probe.py
      - name: Retain public-only findings for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crux-public-source-probe
          path: probe-output/
          retention-days: 1
          if-no-files-found: warn
